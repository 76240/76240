<svg fill="none" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* Ваши собственные стили */
        .contact-card {
          background: linear-gradient(145deg, #1e1e2f, #2a2a40);
          padding: 30px 20px;
          border-radius: 20px;
          text-align: center;
          box-shadow: 0 10px 20px rgba(0,0,0,0.5);
          max-width: 500px;
          margin: 0 auto;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .contact-card h2 {
          color: #ffffff;
          font-size: 24px;
          margin-bottom: 20px;
          letter-spacing: 1px;
        }
        .contact-card .links {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 15px;
        }
        .contact-card .links a {
          display: inline-block;
          background: rgba(255, 255, 255, 0.1);
          color: #e0e0e0;
          padding: 10px 20px;
          border-radius: 30px;
          text-decoration: none;
          font-size: 16px;
          font-weight: 500;
          transition: all 0.3s ease;
          border: 1px solid rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(5px);
        }
        .contact-card .links a:hover {
          background: rgba(255, 255, 255, 0.2);
          transform: translateY(-3px);
          box-shadow: 0 5px 15px rgba(0,0,0,0.3);
          color: #ffffff;
        }
        /* Анимация для заголовка */
        @keyframes fadeInDown {
          from { opacity: 0; transform: translateY(-20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .contact-card h2 {
          animation: fadeInDown 1s ease-out;
        }
      </style>

      <div class="contact-card">
        <h2>📬 Contact Me</h2>
        <div class="links">
          <a href="mailto:your.email@gmail.com">✉️ Email</a>
          <a href="https://t.me/your_username">💬 Telegram</a>
          <a href="https://linkedin.com/in/your-profile">🔗 LinkedIn</a>
          <a href="https://twitter.com/your_handle">🐦 Twitter</a>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
